[package]
name = "nesrs"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/mos6502", "crates/emu-core"]
default-members = [".", "crates/mos6502", "crates/emu-core"]

[dependencies]
emu-core = { path = "crates/emu-core" }
mos6502 = { path = "crates/mos6502" }
bitflags = { version = "2.6.0", features = ["serde"] }
log = "0.4.22"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-big-array = "0.5.1"

[profile.dev]
opt-level = 2

[dev-dependencies]
cpal = "0.18.2"
gilrs = "0.11.2"
minifb = "0.29.0"
serde_json = "1.0.154"
