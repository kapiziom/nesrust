[package]
name = "nesrs"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = { version = "2.6.0", features = ["serde"] }
log = "0.4.22"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-big-array = "0.5.1"

[profile.dev]
opt-level = 2

[dev-dependencies]
cpal = "0.18.2"
minifb = "0.29.0"
