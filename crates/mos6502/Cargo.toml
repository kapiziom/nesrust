[package]
name = "mos6502"
version = "0.1.0"
edition = "2021"
description = "Cycle-accurate NMOS 6502 core (the 2A03 variant without decimal mode), generic over its bus"

[dependencies]
bitflags = { version = "2.6.0", features = ["serde"] }
log = "0.4.22"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
